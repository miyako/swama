theme: jekyll-theme-minimal

markdown: kramdown
kramdown:
  syntax_highlighter: rouge
highlighter: rouge
plugins_dir: _plugins
baseurl: /swama

title: "Swama"
description: "Use Swama from 4D"
logo: "/assets/logo.png"   # optional
show_downloads: false      # source archives are not native CLI downloads
github:
  is_user_page: true
  owner_url: "https://github.com/miyako"
  repository_url: "https://github.com/miyako/swama"
  is_project_page: false

exclude:
  - "vendor"
  - "resources"
  - "LICENSE"
  - "README.md"
  - "Gemfile"
  - "native"
  - "swama"
  - "dist"
