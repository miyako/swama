theme: jekyll-theme-minimal

markdown: kramdown
kramdown:
  syntax_highlighter: rouge
highlighter: rouge
plugins_dir: _plugins
baseurl: /swama

title: "Swama"
description: "Native Swift/MLX inference on Apple Silicon. Run a local server or integrate it with 4D."
url: "https://miyako.github.io"
logo: "/assets/logo.png"
component_version: "20.1.6"
show_downloads: false      # source archives are not native CLI downloads
github:
  is_user_page: true
  owner_url: "https://github.com/miyako"
  repository_url: "https://github.com/miyako/swama"
  is_project_page: false

exclude:
  - "vendor"
  - "resources"
  - "LICENSE"
  - "README.md"
  - "Gemfile"
  - "native"
  - "swama"
  - "dist"
  - "package.json"
