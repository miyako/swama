name: Publish
  
on:
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native-build.yml'
      - '.github/workflows/native-release.yml'
      - '.github/workflows/publish.yml'
      - 'package.json'
      - 'swama/Project/**'
      - 'swama/Resources/**'
  push:
    branches:
    - main
    paths:
      - '*/Project/Sources/**/*.4dm'
      - '*/Project/Sources/*/*.4DForm'
      - '*/Project/Sources/*.4DCatalog'
      - '*/Project/Resources/**'
  workflow_dispatch:
    inputs:
        use_self_hosted:
            type: boolean
            description: use self-hosted ARM64 runner for 4D packaging (native build stays hosted)
            required: true
            default: false
        mode:
          type: choice
          description: semantic versioning
          options: 
          - patch
          - minor 
          - major
          required: true
        upstream_ref:
          type: string
          description: upstream tag, branch or SHA (empty uses native/upstream.json pin)
          default: ''

env: 
  project_path: swama/Project/swama.4DProject

concurrency:
  group: swama-component-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false
  
jobs:

  native:
    uses: ./.github/workflows/native-build.yml
    permissions:
      contents: read
    with:
      upstream_ref: ${{ inputs.upstream_ref || '' }}

  publish:
    needs: native
    if: ${{ github.event_name != 'pull_request' && github.event.inputs.use_self_hosted != 'true' }}
    permissions: write-all
    runs-on: [macos-latest]
    steps:

      - name: configure
        id: configure
        uses: miyako/4D/.github/actions/bash/configure@v1
        with:
          mode: ${{ inputs.mode || 'patch' }}

      - name: checkout 
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: download freshly built native CLI
        uses: actions/download-artifact@v4
        with:
          name: swama-native-macos-arm64
          path: .native-build/download

      - name: set version
        id: version
        uses: miyako/4D/.github/actions/package-set-version@v1
        with:
          mode: ${{ steps.configure.outputs.mode }}

      - name: get tool version
        id: tool
        uses: miyako/4D/.github/actions/tool4d-get-version@v1
        
      - name: get tool4d
        id: get
        uses: miyako/4D/.github/actions/tool4d-download@v1
        with:
          platform: ${{ steps.tool.outputs.platform }}
          branch: ${{ steps.tool.outputs.branch }}
          version: ${{ steps.tool.outputs.version }}
          build: ${{ steps.tool.outputs.build }}
          arch: ${{ steps.tool.outputs.arch }}

      - name: install complete native distribution
        run: |
          cd .native-build/download
          shasum -a 256 --check ./*.sha256
          cd ../..
          python3 native/install.py .native-build/download/*.tar.gz swama/Resources/bin/macOS --component-package

      - name: Resolve pinned 4D dependencies and verify compilation
        run: python3 native/component.py --tool tool4d.app/Contents/MacOS/tool4d

      - name: build
        id: build
        uses: miyako/4D/.github/actions/build-component@v1
        with:
          project_path: ${{ steps.configure.outputs.project_path }}
          pack_project: 'true'
          use_standard_zip: 'true'

      - name: setup keychain 
        id: keychain
        uses: miyako/4D/.github/actions/deployment-setup-keychain@v1
        with:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: codesign
        id: codesign
        uses: miyako/4D/.github/actions/deployment-codesign-product@v1
        with: 
          sign: ${{ secrets.CODESIGN_APPLE_ID }} 
          apple_id: ${{ secrets.NOTARYTOOL_APPLE_ID }}         
          team_id: ${{ secrets.NOTARYTOOL_TEAM_ID }}   
          password: ${{ secrets.NOTARYTOOL_PASSWORD }}
          product_path: ${{ steps.build.outputs.product_path }}
          keychain: ${{ steps.keychain.outputs.KEYCHAIN_PATH }}
          
      - name: zip
        id: zip
        uses: miyako/4D/.github/actions/deployment-create-zip@v1
        with: 
          dmg_path: ${{ steps.codesign.outputs.dmg_path }}
          zip_path: ${{ steps.codesign.outputs.zip_path }}

      - name: upload assets
        id: upload
        uses: miyako/4D/.github/actions/deployment-release-assets@v1
        with: 
          dmg_path: ${{ steps.zip.outputs.dmg_path }}
          zip_path: ${{ steps.zip.outputs.zip_path }}    
          tag_name: ${{ steps.version.outputs.version }}   
          release_name: ${{ steps.version.outputs.version }}  
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    

  publish-locally:
    needs: native
    if: ${{ github.event_name != 'pull_request' && github.event.inputs.use_self_hosted == 'true' }}
    permissions: write-all
    runs-on: [self-hosted, macos, ARM64]
    steps:

      - name: configure
        id: configure
        uses: miyako/4D/.github/actions/bash/configure@v1
        with:
          mode: ${{ inputs.mode || 'patch' }}

      - name: checkout 
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: download freshly built native CLI
        uses: actions/download-artifact@v4
        with:
          name: swama-native-macos-arm64
          path: .native-build/download

      - name: set version
        id: version
        uses: miyako/4D/.github/actions/package-set-version@v1
        with:
          mode: ${{ steps.configure.outputs.mode }}

      - name: get tool version
        id: tool
        uses: miyako/4D/.github/actions/tool4d-get-version@v1
        
      - name: get tool4d
        id: get
        uses: miyako/4D/.github/actions/tool4d-download@v1
        with:
          platform: ${{ steps.tool.outputs.platform }}
          branch: ${{ steps.tool.outputs.branch }}
          version: ${{ steps.tool.outputs.version }}
          build: ${{ steps.tool.outputs.build }}
          arch: ${{ steps.tool.outputs.arch }}

      - name: install complete native distribution
        run: |
          cd .native-build/download
          shasum -a 256 --check ./*.sha256
          cd ../..
          python3 native/install.py .native-build/download/*.tar.gz swama/Resources/bin/macOS --component-package

      - name: Resolve pinned 4D dependencies and verify compilation
        run: python3 native/component.py --tool tool4d.app/Contents/MacOS/tool4d

      - name: build
        id: build
        uses: miyako/4D/.github/actions/build-component@v1
        with:
          project_path: ${{ steps.configure.outputs.project_path }}
          pack_project: 'true'
          use_standard_zip: 'true'

      - name: setup keychain 
        id: keychain
        uses: miyako/4D/.github/actions/deployment-setup-keychain@v1
        with:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: codesign
        id: codesign
        uses: miyako/4D/.github/actions/deployment-codesign-product@v1
        with: 
          sign: ${{ secrets.CODESIGN_APPLE_ID }} 
          apple_id: ${{ secrets.NOTARYTOOL_APPLE_ID }}         
          team_id: ${{ secrets.NOTARYTOOL_TEAM_ID }}   
          password: ${{ secrets.NOTARYTOOL_PASSWORD }}
          product_path: ${{ steps.build.outputs.product_path }}
          keychain: ${{ steps.keychain.outputs.KEYCHAIN_PATH }}
          
      - name: zip
        id: zip
        uses: miyako/4D/.github/actions/deployment-create-zip@v1
        with: 
          dmg_path: ${{ steps.codesign.outputs.dmg_path }}
          zip_path: ${{ steps.codesign.outputs.zip_path }}

      - name: upload assets
        id: upload
        uses: miyako/4D/.github/actions/deployment-release-assets@v1
        with: 
          dmg_path: ${{ steps.zip.outputs.dmg_path }}
          zip_path: ${{ steps.zip.outputs.zip_path }}    
          tag_name: ${{ steps.version.outputs.version }}   
          release_name: ${{ steps.version.outputs.version }}  
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    

  component-check:
    name: Verify unsigned 4D component
    if: github.event_name == 'pull_request'
    needs: native
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: swama-native-macos-arm64
          path: .native-build/download
      - name: Install verified native distribution
        run: |
          cd .native-build/download
          shasum -a 256 --check ./*.sha256
          cd ../..
          python3 native/install.py .native-build/download/*.tar.gz swama/Resources/bin/macOS
      - name: Read tool4d version
        id: tool
        uses: miyako/4D/.github/actions/tool4d-get-version@v1
        with:
          build_project_name: swama
      - name: Download tool4d
        uses: miyako/4D/.github/actions/tool4d-download@v1
        with:
          platform: ${{ steps.tool.outputs.platform }}
          branch: ${{ steps.tool.outputs.branch }}
          version: ${{ steps.tool.outputs.version }}
          build: ${{ steps.tool.outputs.build }}
          arch: ${{ steps.tool.outputs.arch }}
      - name: Resolve pinned 4D dependencies and verify compilation
        run: python3 native/component.py --tool tool4d.app/Contents/MacOS/tool4d

      - name: Compile and package without version bump or signing
        id: component
        uses: miyako/4D/.github/actions/build-component@v1
        with:
          project_path: ${{ github.workspace }}/swama/Project/swama.4DProject
          pack_project: 'true'
          use_standard_zip: 'true'
      - name: Verify actual component output and native resources
        env:
          PRODUCT_PATH: ${{ steps.component.outputs.product_path }}
        run: |
          test -d "$PRODUCT_PATH"
          test -n "$(find "$PRODUCT_PATH" -iname '*.4dz' -type f -print -quit)"
          python3 native/smoke.py "$PRODUCT_PATH/Resources/bin/macOS"
          git diff --exit-code -- package.json native/upstream.json
          tar -czf .native-build/swama-component-validation.tar.gz -C "$(dirname "$PRODUCT_PATH")" "$(basename "$PRODUCT_PATH")"
      - uses: actions/upload-artifact@v4
        with:
          name: swama-component-validation-macos-arm64
          path: .native-build/swama-component-validation.tar.gz
          if-no-files-found: error
          retention-days: 14
